train_data_budget: 1.0
val_data_budget: 1.0
max_train_data: 50000

sensor: xela

dataset:
  _target_: tactile_ssl.data.xela_force.ForceDataset.create_from_files
  data_path: ${paths.data_root}/xela_data/downstream_tasks/force_estimation/
  urdf_path: ${paths.data_root}/xela/pretraining/extracted/urdf/ahrcpcpn.urdf
  baseline_signal_path: ${paths.data_root}/xela_data/downstream_tasks/force_estimation/base_line_fremont_hand/xela/data.pkl
  config:
    subtract_baseline: True
    normalize: False
    window_time: 0.1
    interpolating_freq: 100
    normal_force_contact_threshold: 0.15
    max_normal_force: [1.0, 1.0, 5.0]

train_dataloader:
  batch_size: 64
  num_workers: 1
  drop_last: True
  pin_memory: True
  persistent_workers: True
  shuffle: True

val_dataloader:
  batch_size: 64
  num_workers: 1
  drop_last: True
  pin_memory: True
  persistent_workers: True
  shuffle: False
