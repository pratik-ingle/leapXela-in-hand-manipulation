sensor:
  d360:
    dataset:
      _target_: tactile_ssl.data.d360_tactile.D360SSLDataset
      config:
        data_path: ${paths.data_root}
        msg:
          device: ["img", "mic_fbank", "imu_acc", "pressure"]
          system: []
          label: ["object", "action"]
        synced: False
        data:
          device:
            img:
              topic: ["image_raw/compressed"]
              rm_bg: False
              sample_rate: 30
              length: 2
              stride: 5
              size: ${img_size}
              load:
                _partial_: True
                _target_: tactile_ssl.data.d360.utils.load_image
                preload: False
              sync:
                _partial_: True
                _target_: tactile_ssl.data.d360.utils.sync_image
            mic_wave:
              topic: ["mic_0", "mic_1"]
              sample_rate: 48000
              stride: 1
              load:
                _partial_: True
                _target_: tactile_ssl.data.d360.utils.load_mic_wave
              sync:
                _partial_: True
                _target_: tactile_ssl.data.d360.utils.sync_audio
            mic_fbank:
              topic: null
              length: ${mic_size[0]}
              stride: 1
              frame_shift: 2.5
              frame_length: 5
              num_mel_bins: ${int_divide:${mic_size[1]}, 2}
              low_freq: 1
              high_freq: 16000
            imu_acc:
              topic: ["imu_raw_topic"]
              length: ${imu_size}
              stride: 1
              sample_rate: 400
              load:
                _partial_: True
                _target_: tactile_ssl.data.d360.utils.load_time_series
                interp: "linear"
                func:
                  _partial_: True
                  _target_: tactile_ssl.data.d360.utils.preprocess_imu
                  type: "acc"
              sync:
                _partial_: True
                _target_: tactile_ssl.data.d360.utils.sync_time_series
                topic: "imu_acc"
            pressure:
              topic: ["pressure_topic"]
              length: ${pressure_size}
              stride: 1
              sample_rate: 200
              load:
                _partial_: True
                _target_: tactile_ssl.data.d360.utils.load_time_series
                interp: "linear"
                func:
                  _partial_: True
                  _target_: tactile_ssl.data.d360.utils.preprocess_pressure
              sync:
                _partial_: True
                _target_: tactile_ssl.data.d360.utils.sync_time_series
                topic: "pressure"
              filter:
                _target_: tactile_ssl.data.d360.utils.high_pass_filter
                cutoff: 0.5
                fs: ${data.sensor.d360.dataset.config.data.device.pressure.sample_rate}
                order: 5
          system: null
          label:
            object:
              key: object
              cls: null
              weight: null
            action:
              key: action
              cls: null
              weight: null
            surface:
              key: surface
              cls: null
              weight: null
          min_time: 0.15
        aug:
          img:
            flip_aug:
              p: 0.0
            crop_aug:
              p: 0.0
              range: [0.70, 0.95]
            rot_aug:
              p: 0.0
              range: [-120, 120]
          mic_fbank:
            rand_aug:
              p: 0.1
              range: [-0.1, 0.1]
            scale: ~
          imu_acc:
            rand_aug:
              p: 0.1
              range: [-0.01, 0.01]
          pressure:
            rand_aug:
              p: 0.1
              range: [-0.1, 0.1]
            scale: ~
        normalization:
          img:
            avg: [0.09562227, 0.26593734, 0.32464101]
            std: [0.08179263, 0.17255498, 0.18509875]
            div: 1
          mic_fbank:
            normalize:
              _partial_: True
              _target_: tactile_ssl.data.d360.utils.normalize_mic_fbank
            avg: null
            std: null
            div: 2
            range: [-32, 32]
          imu_acc:
            div: 4
          pressure:
            normalize:
              _partial_: True
              _target_: tactile_ssl.data.d360.utils.normalize_pressure
            avg: null
            std: null
            div: 2
            range: [-16, 16]

