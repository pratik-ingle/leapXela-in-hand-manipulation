train_data_budget: 1.0
val_data_budget: 1.0
max_train_data: 20000

sensor: xela

dataset:
  _target_: tactile_ssl.data.xela_pose_estimation.RelativePoseDataset.create_from_files
  data_path: ${paths.data_root}/xela/downstream_tasks/relative_pose_estimation
  urdf_path: ${paths.data_root}/xela/pretraining/extracted/urdf/ahrcpcpn.urdf
  baseline_signal_path: ${paths.data_root}/xela/pretraining/extracted/baseline/xela/data.pkl
  config:
    discretize: ~ # Should be either null or int
    subtract_baseline: True
    normalize: False
    window_time: 10
    interpolating_freq: 100
    train_data_budget: 1.0
    val_data_budget: 1.0

train_dataloader:
  batch_size: 16
  num_workers: 1
  drop_last: True
  pin_memory: True
  persistent_workers: True
  shuffle: True

val_dataloader:
  batch_size: 16
  num_workers: 1
  drop_last: True
  pin_memory: True
  persistent_workers: True
  shuffle: False
