train_val_split: 0.7
train_data_budget: 1.0
val_data_budget: 1.0
remove_bg: False
sensor: d360_contact

dataset:
  _target_: tactile_ssl.data.d360_tactile.D360SSLDataset
  config:
    data_path: ${paths.data_root}
    devices: ["d360_0"]
    synced: False
    msg:
      device:
        ["img", "mic_fbank", "imu_acc", "pressure", "force", "angle", "height"]
      system: []
      label: []
    data:
      device:
        img:
          topic: ["image_raw/compressed"]
          rm_bg: False
          sample_rate: 30
          length: 2
          stride: 5
          size: ${img_size}
          load:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.load_image
            preload: False
          sync:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.sync_image
        mic_wave:
          topic: ["mic_0", "mic_1"]
          sample_rate: 48000
          stride: 1
          load:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.load_mic_wave
          sync:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.sync_audio
        mic_fbank:
          topic: null
          length: ${mic_size[0]}
          stride: 1
          frame_shift: 2.5
          frame_length: 5
          num_mel_bins: ${int_divide:${mic_size[1]}, 2}
          low_freq: 1
          high_freq: 16000
        imu_acc:
          topic: ["imu_raw_topic"]
          length: ${imu_size}
          stride: 1
          sample_rate: 400
          load:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.load_time_series
            interp: "linear"
            func:
              _partial_: True
              _target_: tactile_ssl.data.d360.utils.preprocess_imu
              type: "acc"
          sync:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.sync_time_series
            topic: "imu_acc"
        pressure:
          topic: ["pressure_topic"]
          length: ${pressure_size}
          stride: 1
          sample_rate: 200
          load:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.load_time_series
            interp: "linear"
            func:
              _partial_: True
              _target_: tactile_ssl.data.d360.utils.preprocess_pressure
          sync:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.sync_time_series
            topic: "pressure"
          filter:
            _target_: tactile_ssl.data.d360.utils.high_pass_filter
            cutoff: 0.5
            fs: ${data.dataset.config.data.device.pressure.sample_rate}
            order: 5
        force:
          topic: ["netft_data1"]
          length: ${data.dataset.config.data.device.img.length}
          stride: ${data.dataset.config.data.device.img.stride}
          sample_rate: ${data.dataset.config.data.device.img.sample_rate}
          max_force: [1.0, 1.0, 3.0]
          load:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.load_time_series
            interp: "linear"
            func:
              _partial_: True
              _target_: tactile_ssl.data.d360.utils.preprocess_force
          sync:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.sync_time_series
            topic: "force"
        angle:
          topic: ["d360_pose"]
          length: ${data.dataset.config.data.device.img.length}
          stride: ${data.dataset.config.data.device.img.stride}
          sample_rate: ${data.dataset.config.data.device.img.sample_rate}
          load:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.load_time_series
            interp: "linear"
            func:
              _partial_: True
              _target_: tactile_ssl.data.d360.utils.preprocess_contact
              type: angle
          sync:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.sync_time_series
            topic: "angle"
        height:
          topic: ["d360_pose"]
          length: ${data.dataset.config.data.device.img.length}
          stride: ${data.dataset.config.data.device.img.stride}
          sample_rate: ${data.dataset.config.data.device.img.sample_rate}
          load:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.load_time_series
            interp: "linear"
            func:
              _partial_: True
              _target_: tactile_ssl.data.d360.utils.preprocess_contact
              type: height
          sync:
            _partial_: True
            _target_: tactile_ssl.data.d360.utils.sync_time_series
            topic: "height"
      system: null
      label: null
      min_time: 0.15
    aug:
      img:
        flip_aug:
          p: 0.0
        crop_aug:
          p: 0.0
          range: [0.70, 0.95]
        rot_aug:
          p: 0.0
          range: [-120, 120]
      mic_fbank:
        rand_aug:
          p: 0.0
          range: [-0.1, 0.1]
      imu_acc:
        rand_aug:
          p: 0.0
          range: [-0.01, 0.01]
      pressure:
        rand_aug:
          p: 0.0
          range: [-0.1, 0.1]
        scale: ~
    normalization:
      img:
        avg: [0.09343095, 0.23987080, 0.22293295]
        std: [0.08640242, 0.15979276, 0.16384651]
        div: 1
      mic_fbank:
        normalize:
          _partial_: True
          _target_: tactile_ssl.data.d360.utils.normalize_mic_fbank
        avg: null
        std: null
        div: 2
        range: [-32, 32]
      imu_acc:
        div: 4
      pressure:
        normalize:
          _partial_: True
          _target_: tactile_ssl.data.d360.utils.normalize_pressure
        avg: null
        std: null
        div: 2
        range: [-16, 16]

    dataset_list:
      - d360/20241126-fre-d360-contact/0-forces/seqs/0-0_14_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/2-18_32_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/4-36_50_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/6-54_68_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/8-72_86_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/10-90_104_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/12-108_122_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/14-126_140_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/16-144_158_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/18-162_176_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/20-180_194_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/22-198_212_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/24-216_230_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/26-234_248_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/28-252_266_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/30-270_284_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/32-288_302_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/34-306_320_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/36-324_338_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/38-342_356_deg
    dataset_list_test:
      - d360/20241126-fre-d360-contact/0-forces/seqs/1-16_16_deg
      - d360/20241126-fre-d360-contact/0-forces/seqs/3-34_34_deg
