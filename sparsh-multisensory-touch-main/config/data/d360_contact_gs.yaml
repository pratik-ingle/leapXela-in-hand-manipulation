train_dataloader:
  batch_size: 128
  num_workers: 8
  drop_last: True
  pin_memory: True
  shuffle: True
  persistent_workers: True

val_dataloader:
  batch_size: 128
  num_workers: 8
  drop_last: True
  pin_memory: True
  shuffle: True
  persistent_workers: True
